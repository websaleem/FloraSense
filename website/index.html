<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FloraSense — Upload a flower image and identify its species using deep learning powered by PyTorch.">
    <title>FloraSense — AI-Powered Flower Identification</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ------------------------------------------------------------------ */
        /*  Design tokens                                                     */
        /* ------------------------------------------------------------------ */
        :root {
            --bg:           #0c0f1a;
            --surface:      #151929;
            --surface-2:    #1c2137;
            --border:       rgba(255,255,255,.06);
            --text:         #e4e6f0;
            --text-muted:   #7c819a;
            --accent:       #6c5ce7;
            --accent-light: #a29bfe;
            --accent-glow:  rgba(108,92,231,.25);
            --success:      #00cec9;
            --pink:         #fd79a8;
            --orange:       #fdcb6e;
            --radius:       16px;
            --font:         'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* ------------------------------------------------------------------ */
        /*  Reset & base                                                      */
        /* ------------------------------------------------------------------ */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* Subtle animated gradient background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 50% at 20% 10%, rgba(108,92,231,.12) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 80% 80%, rgba(253,121,168,.08) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        /* ------------------------------------------------------------------ */
        /*  Layout                                                            */
        /* ------------------------------------------------------------------ */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 680px;
            padding: 48px 24px 64px;
        }

        /* ------------------------------------------------------------------ */
        /*  Header                                                            */
        /* ------------------------------------------------------------------ */
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        header .icon {
            font-size: 48px;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 18px var(--accent-glow));
        }
        header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -.4px;
            background: linear-gradient(135deg, var(--accent-light), var(--pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        header p {
            margin-top: 8px;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 400;
        }

        /* ------------------------------------------------------------------ */
        /*  Glass card                                                        */
        /* ------------------------------------------------------------------ */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            backdrop-filter: blur(16px);
            padding: 32px;
            margin-bottom: 24px;
            transition: box-shadow .3s;
        }
        .card:hover { box-shadow: 0 0 40px rgba(108,92,231,.08); }

        /* ------------------------------------------------------------------ */
        /*  Drop zone                                                         */
        /* ------------------------------------------------------------------ */
        .dropzone {
            border: 2px dashed rgba(108,92,231,.35);
            border-radius: 12px;
            padding: 48px 24px;
            text-align: center;
            cursor: pointer;
            transition: border-color .25s, background .25s;
            position: relative;
        }
        .dropzone:hover,
        .dropzone.dragover {
            border-color: var(--accent);
            background: rgba(108,92,231,.06);
        }
        .dropzone input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }
        .dropzone .dz-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }
        .dropzone .dz-label {
            font-size: 15px;
            color: var(--text-muted);
        }
        .dropzone .dz-label strong {
            color: var(--accent-light);
            font-weight: 600;
        }

        /* Image preview */
        .preview-wrapper {
            display: none;
            margin-top: 20px;
            justify-content: center;
        }
        .preview-wrapper img {
            max-width: 100%;
            max-height: 280px;
            border-radius: 10px;
            object-fit: cover;
            box-shadow: 0 8px 32px rgba(0,0,0,.35);
        }

        /* ------------------------------------------------------------------ */
        /*  Button                                                            */
        /* ------------------------------------------------------------------ */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 24px;
            padding: 12px 32px;
            border: none;
            border-radius: 10px;
            font-family: var(--font);
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            cursor: pointer;
            transition: transform .15s, box-shadow .25s, opacity .2s;
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px var(--accent-glow);
        }
        .btn:active { transform: scale(.97); }
        .btn:disabled {
            opacity: .45;
            cursor: not-allowed;
            transform: none;
        }

        /* ------------------------------------------------------------------ */
        /*  Spinner                                                           */
        /* ------------------------------------------------------------------ */
        .spinner {
            display: none;
            width: 22px; height: 22px;
            border: 3px solid rgba(255,255,255,.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ------------------------------------------------------------------ */
        /*  Results                                                           */
        /* ------------------------------------------------------------------ */
        #results-card { display: none; }

        .result-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .result-header .badge {
            background: linear-gradient(135deg, var(--success), #55efc4);
            color: #0c0f1a;
            font-size: 12px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: .5px;
        }
        .result-header h2 {
            font-size: 18px;
            font-weight: 600;
        }

        .result-row {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 14px;
            opacity: 0;
            transform: translateX(-12px);
            animation: fadeInRow .4s ease forwards;
        }
        .result-row:nth-child(2) { animation-delay: .05s; }
        .result-row:nth-child(3) { animation-delay: .10s; }
        .result-row:nth-child(4) { animation-delay: .15s; }
        .result-row:nth-child(5) { animation-delay: .20s; }

        @keyframes fadeInRow {
            to { opacity: 1; transform: translateX(0); }
        }

        .result-rank {
            flex-shrink: 0;
            width: 28px; height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            background: var(--surface-2);
            color: var(--text-muted);
        }
        .result-row:first-child .result-rank {
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            color: #fff;
        }

        .result-info {
            flex: 1;
            min-width: 0;
        }
        .result-name {
            font-size: 14px;
            font-weight: 600;
            text-transform: capitalize;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bar-track {
            height: 8px;
            background: var(--surface-2);
            border-radius: 4px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, var(--accent), var(--accent-light));
            width: 0;
            transition: width .6s cubic-bezier(.4,0,.2,1);
        }
        .result-row:first-child .bar-fill {
            background: linear-gradient(90deg, var(--accent), var(--pink));
        }

        .result-prob {
            flex-shrink: 0;
            font-size: 14px;
            font-weight: 600;
            color: var(--accent-light);
            width: 52px;
            text-align: right;
        }

        /* ------------------------------------------------------------------ */
        /*  Error                                                             */
        /* ------------------------------------------------------------------ */
        .error-msg {
            display: none;
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            color: #fab1a0;
            background: rgba(214,48,49,.12);
            border: 1px solid rgba(214,48,49,.25);
        }

        /* ------------------------------------------------------------------ */
        /*  Footer                                                            */
        /* ------------------------------------------------------------------ */
        footer {
            text-align: center;
            padding: 24px;
            font-size: 12px;
            color: var(--text-muted);
        }
        footer a {
            color: var(--accent-light);
            text-decoration: none;
        }
        footer a:hover { text-decoration: underline; }

        /* ------------------------------------------------------------------ */
        /*  Responsive                                                        */
        /* ------------------------------------------------------------------ */
        @media (max-width: 480px) {
            .container { padding: 32px 16px 48px; }
            header h1 { font-size: 22px; }
            .card { padding: 20px; }
            .dropzone { padding: 32px 16px; }
        }
        /* ------------------------------------------------------------------ */
        /*  Capture controls                                                  */
        /* ------------------------------------------------------------------ */
        .capture-row {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        .btn-capture {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            /* 56px clears the 44px minimum touch target with room to spare —
               this is the control a user taps one-handed, outdoors, on a phone. */
            min-height: 56px;
            padding: 14px 18px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(255,255,255,.04);
            color: var(--text);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: background .2s, border-color .2s, transform .1s;
        }
        .btn-capture:hover { border-color: var(--accent); background: rgba(108,92,231,.10); }
        .btn-capture:active { transform: scale(.98); }
        .btn-capture.primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            border-color: transparent;
            color: #fff;
        }
        .cap-icon { font-size: 20px; line-height: 1; }

        .preview-meta {
            margin-top: 10px;
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
        }
        .btn-retake {
            margin-top: 12px;
            min-height: 44px;
            padding: 10px 22px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-muted);
            font-size: 14px;
            cursor: pointer;
            transition: color .2s, border-color .2s;
        }
        .btn-retake:hover { color: var(--text); border-color: var(--accent); }

        /* Touch: drag & drop is meaningless, so the dropzone goes away and the
           capture buttons stack full-width for thumb reach. */
        @media (hover: none) and (pointer: coarse) {
            .dropzone { display: none; }
            .capture-row { flex-direction: column; }
        }
        /* Pointer devices: `capture` is ignored by desktop browsers, so the
           camera button would just be a second "browse" — hide it. */
        @media (hover: hover) and (pointer: fine) {
            .btn-capture.primary { display: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <header>
        <div class="icon">🌸</div>
        <h1>FloraSense</h1>
        <p>Upload a flower photo and let AI identify its species</p>
    </header>

    <!-- Upload card -->
    <div class="card" id="upload-card">
        <!-- Two inputs, not one. `capture` opens the rear camera directly, but on
             several mobile browsers it also suppresses the photo-library option,
             so the "choose" path needs an input of its own without the attribute. -->
        <div class="capture-row">
            <label class="btn-capture primary" for="camera-input">
                <span class="cap-icon">📷</span> Take Photo
            </label>
            <label class="btn-capture" for="file-input">
                <span class="cap-icon">🖼️</span> Choose Photo
            </label>
        </div>
        <input type="file" id="camera-input" accept="image/*" capture="environment" hidden>
        <input type="file" id="file-input" accept="image/*" hidden>

        <!-- Hidden on touch devices via CSS: dragging a file has no meaning there. -->
        <div class="dropzone" id="dropzone">
            <div class="dz-icon">🌸</div>
            <div class="dz-label">
                or drag &amp; drop an image here
            </div>
        </div>
        <div class="preview-wrapper" id="preview-wrapper">
            <img id="preview-img" alt="Preview of the selected flower image">
            <div class="preview-meta" id="preview-meta"></div>
            <button class="btn-retake" id="retake-btn" type="button">↺ Retake</button>
        </div>
        <div style="text-align:center;">
            <button class="btn" id="classify-btn" disabled>
                <span id="btn-text">Identify Flower</span>
                <div class="spinner" id="spinner"></div>
            </button>
        </div>
        <div class="error-msg" id="error-msg"></div>
    </div>

    <!-- Results card -->
    <div class="card" id="results-card">
        <div class="result-header">
            <span class="badge">Top Predictions</span>
            <h2 id="top-flower-name"></h2>
        </div>
        <div id="results-list"></div>
    </div>
</div>

<footer>
    Built with PyTorch &amp; FastAPI &mdash; <a href="https://github.com/websaleem/FloraSense" target="_blank" rel="noopener">FloraSense on GitHub</a>
</footer>

<script>
(function () {
    'use strict';

    const dropzone    = document.getElementById('dropzone');
    const fileInput   = document.getElementById('file-input');
    const cameraInput = document.getElementById('camera-input');
    const previewMeta = document.getElementById('preview-meta');
    const retakeBtn   = document.getElementById('retake-btn');
    const previewWr  = document.getElementById('preview-wrapper');
    const previewImg = document.getElementById('preview-img');
    const btn        = document.getElementById('classify-btn');
    const btnText    = document.getElementById('btn-text');
    const spinner    = document.getElementById('spinner');
    const errorMsg   = document.getElementById('error-msg');
    const resCard    = document.getElementById('results-card');
    const resList    = document.getElementById('results-list');
    const topName    = document.getElementById('top-flower-name');

    /* Lambda Function URLs cap a request at 6 MB, and binary bodies are
       base64-encoded in transit (~33% inflation), leaving roughly 4.4 MB of
       real payload. A current phone camera easily produces more than that, so
       every image is re-encoded here before it is sent.

       Downscaling is free accuracy-wise: process_image() resizes to 224x224
       server-side, so 1024px on the long edge is already far more detail than
       the model consumes. Re-encoding also normalises iPhone HEIC to JPEG,
       which the backend's Pillow cannot decode without extra libraries. */
    const MAX_EDGE     = 1024;
    const JPEG_QUALITY = 0.85;
    const HARD_LIMIT   = 4.4 * 1024 * 1024;

    let selectedBlob = null;

    function fmtBytes(n) {
        if (n < 1024) return n + ' B';
        if (n < 1048576) return Math.round(n / 1024) + ' KB';
        return (n / 1048576).toFixed(1) + ' MB';
    }

    async function decodeImage(file) {
        /* imageOrientation:'from-image' applies the EXIF rotation flag. Phones
           record orientation as metadata rather than rotating the pixels, so
           without this a portrait photo reaches the model on its side. */
        if (self.createImageBitmap) {
            try {
                return await createImageBitmap(file, { imageOrientation: 'from-image' });
            } catch (e) { /* HEIC on a non-Safari browser lands here */ }
        }
        return await new Promise((resolve, reject) => {
            const img = new Image();
            img.onload  = () => resolve(img);
            img.onerror = () => reject(new Error('That file could not be read as an image.'));
            img.src = URL.createObjectURL(file);
        });
    }

    async function prepareImage(file) {
        const src = await decodeImage(file);
        const w0 = src.width, h0 = src.height;
        const scale = Math.min(1, MAX_EDGE / Math.max(w0, h0));
        const w = Math.round(w0 * scale), h = Math.round(h0 * scale);

        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(src, 0, 0, w, h);
        if (src.close) src.close();

        const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', JPEG_QUALITY));
        if (!blob) throw new Error('That image could not be processed.');
        return { blob, w, h, w0, h0 };
    }

    /* ---------- Drag & drop ---------- */
    ['dragenter', 'dragover'].forEach(evt =>
        dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add('dragover'); })
    );
    ['dragleave', 'drop'].forEach(evt =>
        dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove('dragover'); })
    );
    dropzone.addEventListener('drop', e => {
        const files = e.dataTransfer.files;
        if (files.length) handleFile(files[0]);
    });

    [fileInput, cameraInput].forEach(input => {
        input.addEventListener('change', () => {
            if (input.files.length) handleFile(input.files[0]);
            /* Reset so re-picking the same file still fires a change event —
               otherwise "Retake" then choosing the same shot does nothing. */
            input.value = '';
        });
    });

    dropzone.addEventListener('click', () => fileInput.click());

    retakeBtn.addEventListener('click', () => {
        selectedBlob = null;
        previewWr.style.display = 'none';
        previewImg.removeAttribute('src');
        previewMeta.textContent = '';
        resCard.style.display = 'none';
        btn.disabled = true;
        hideError();
    });

    async function handleFile(file) {
        /* iOS can report an empty type for HEIC, so fall back to the extension
           rather than rejecting a legitimate photo on a missing MIME type. */
        const looksLikeImage = (file.type && file.type.startsWith('image/'))
                             || /\.(jpe?g|png|gif|webp|hei[cf])$/i.test(file.name || '');
        if (!looksLikeImage) {
            showError('Please choose an image file (JPEG, PNG, HEIC).');
            return;
        }

        hideError();
        resCard.style.display = 'none';
        btn.disabled = true;
        btnText.textContent = 'Preparing…';

        try {
            const { blob, w, h, w0, h0 } = await prepareImage(file);
            if (blob.size > HARD_LIMIT) {
                showError('That photo is still too large after resizing. Please try another.');
                return;
            }
            selectedBlob = blob;

            /* Preview the processed blob, not the original: what you see is
               exactly what gets sent, including the EXIF rotation applied. */
            previewImg.src = URL.createObjectURL(blob);
            previewWr.style.display = 'flex';
            previewMeta.textContent = (w < w0 || h < h0)
                ? `${w0}×${h0} → ${w}×${h}  ·  ${fmtBytes(file.size)} → ${fmtBytes(blob.size)}`
                : `${w}×${h}  ·  ${fmtBytes(blob.size)}`;
            btn.disabled = false;
        } catch (err) {
            showError(err.message || 'That image could not be read.');
        } finally {
            btnText.textContent = 'Identify Flower';
        }
    }

    /* ---------- Classify ---------- */
    btn.addEventListener('click', async () => {
        if (!selectedBlob) return;
        setLoading(true);
        hideError();
        resCard.style.display = 'none';

        try {
            /* CloudFront reaches the API through an Origin Access Control, which
               SigV4-signs each origin request. CloudFront does not read the body,
               so it signs whatever payload hash the viewer supplies -- and Lambda
               function URLs reject unsigned payloads outright. A plain
               FormData POST therefore always came back 403 "signature does not
               match". So the multipart body is assembled by hand (FormData
               picks its own boundary and will not reveal the exact bytes) and
               its SHA-256 goes in x-amz-content-sha256. */
            const { body, boundary, hash } = await buildSignedMultipart(selectedBlob, 'capture.jpg');

            const resp = await fetch('/predict?top_k=5', {
                method: 'POST',
                headers: {
                    'Content-Type': `multipart/form-data; boundary=${boundary}`,
                    'x-amz-content-sha256': hash,
                },
                body,
            });
            if (!resp.ok) {
                const err = await resp.json().catch(() => ({}));
                throw new Error(err.detail || `Server error (${resp.status})`);
            }
            const data = await resp.json();
            renderResults(data.predictions);
        } catch (err) {
            showError(err.message);
        } finally {
            setLoading(false);
        }
    });

    /* ---------- Render ---------- */
    function renderResults(predictions) {
        resList.innerHTML = '';
        if (!predictions || !predictions.length) {
            showError('No predictions returned.');
            return;
        }

        topName.textContent = predictions[0].flower_name;

        predictions.forEach((p, i) => {
            const pct = (p.probability * 100).toFixed(1);
            const row = document.createElement('div');
            row.className = 'result-row';
            row.innerHTML = `
                <div class="result-rank">${i + 1}</div>
                <div class="result-info">
                    <div class="result-name">${p.flower_name}</div>
                    <div class="bar-track"><div class="bar-fill" id="bar-${i}"></div></div>
                </div>
                <div class="result-prob">${pct}%</div>
            `;
            resList.appendChild(row);
        });

        resCard.style.display = 'block';

        // Animate bars after a tiny delay so the CSS transition fires
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                predictions.forEach((p, i) => {
                    document.getElementById(`bar-${i}`).style.width = `${(p.probability * 100).toFixed(1)}%`;
                });
            });
        });
    }

    /* ---------- Helpers ---------- */

    /* Build a multipart/form-data body by hand and return it with its
       boundary and SHA-256 hex digest. See the note in the click handler:
       CloudFront's OAC signing requires the payload hash up front. */
    async function buildSignedMultipart(blob, filename) {
        const boundary = '----FloraSense' + Math.random().toString(16).slice(2) + Date.now().toString(16);
        const encoder = new TextEncoder();

        const head = encoder.encode(
            `--${boundary}\r\n` +
            `Content-Disposition: form-data; name="file"; filename="${filename}"\r\n` +
            `Content-Type: ${blob.type || 'image/jpeg'}\r\n\r\n`
        );
        const tail = encoder.encode(`\r\n--${boundary}--\r\n`);
        const file = new Uint8Array(await blob.arrayBuffer());

        const body = new Uint8Array(head.length + file.length + tail.length);
        body.set(head, 0);
        body.set(file, head.length);
        body.set(tail, head.length + file.length);

        const digest = await crypto.subtle.digest('SHA-256', body);
        const hash = Array.from(new Uint8Array(digest))
            .map(b => b.toString(16).padStart(2, '0'))
            .join('');

        return { body, boundary, hash };
    }

    function setLoading(on) {
        btn.disabled = on;
        spinner.style.display = on ? 'block' : 'none';
        btnText.textContent = on ? 'Identifying…' : 'Identify Flower';
    }

    function showError(msg) {
        errorMsg.textContent = msg;
        errorMsg.style.display = 'block';
    }
    function hideError() {
        errorMsg.style.display = 'none';
    }
})();
</script>

</body>
</html>
