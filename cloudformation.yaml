AWSTemplateFormatVersion: '2010-09-09'
Description: >
  FloraSense — AI-powered flower species identification.
  Deploys a container-image Lambda behind a public Function URL.

# ---------------------------------------------------------------------------
#  Parameters
# ---------------------------------------------------------------------------
Parameters:
  AppName:
    Type: String
    Default: florasense
    Description: Application name used for resource naming.

  ImageTag:
    Type: String
    Default: latest
    Description: Docker image tag to deploy.

  MemorySize:
    Type: Number
    Default: 512
    AllowedValues: [512, 1024, 2048, 3072]
    Description: Lambda memory in MB. VGG16 may need 1024+.

  Timeout:
    Type: Number
    Default: 60
    MinValue: 10
    MaxValue: 900
    Description: Lambda timeout in seconds.

  Arch:
    Type: String
    Default: vgg16
    AllowedValues: [vgg16, densenet121, efficientnet_b0]
    Description: Model architecture to load at startup.

# ---------------------------------------------------------------------------
#  Resources
# ---------------------------------------------------------------------------
Resources:

  # ---- ECR Repository ----
  ECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref AppName
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep only the 5 most recent images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 5
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }

  # ---- IAM Execution Role ----
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AppName}-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # ---- Lambda Function (Container Image) ----
  LambdaFunction:
    Type: AWS::Lambda::Function
    DependsOn: ECRRepository
    Properties:
      FunctionName: !Sub '${AppName}-api'
      PackageType: Image
      Code:
        ImageUri: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${AppName}:${ImageTag}'
      Role: !GetAtt LambdaExecutionRole.Arn
      MemorySize: !Ref MemorySize
      Timeout: !Ref Timeout
      Architectures:
        - x86_64
      Environment:
        Variables:
          ARCH: !Ref Arch

  # ---- Function URL (public HTTPS endpoint) ----
  LambdaFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt LambdaFunction.Arn
      AuthType: NONE
      Cors:
        AllowOrigins:
          - '*'
        AllowMethods:
          - '*'
        AllowHeaders:
          - '*'

  # ---- Permission for unauthenticated invocation ----
  LambdaFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LambdaFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

# ---------------------------------------------------------------------------
#  Outputs
# ---------------------------------------------------------------------------
Outputs:
  ECRRepositoryUri:
    Description: ECR repository URI for pushing Docker images.
    Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${AppName}'

  LambdaFunctionName:
    Description: Name of the deployed Lambda function.
    Value: !Ref LambdaFunction

  FunctionUrl:
    Description: Public HTTPS endpoint for the FloraSense API.
    Value: !GetAtt LambdaFunctionUrl.FunctionUrl
